<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/contact.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Lando</title>
  </head>
  <body>
    <header>
      <nav class="container nav-section">
        <!--logo-->
        <div class="nav-left">
          <a class="logo" href="./index.html">Lando</a>
          <!--nav-links-->
          <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="./pricing.html">Pricing</a></li>
            <li><a href="./about.html">About us</a></li>
            <li><a href="./contact.html" class="active">Contact</a></li>
          </ul>
        </div>
        <button class="harm-burger"><i class="fa-solid fa-bars"></i></button>
        <!--buttons-->
        <div class="btn-grp">
          <button class="btn btn1">Log in</button>
          <button class="btn btn2">Sign up</button>
        </div>
      </nav>
    </header>
    <main>
      <section id="contact-header">
        <div class="container contact">
          <div class="c-left">
            <img
              src="../assets/images/Lando_Illustration.png"
              alt="lando-img"
              loading="lazy"
            />
          </div>
          <div class="c-right">
            <h3>Contact Us</h3>
            <p>Explore the future with us.<br />Feel free to get in touch.</p>
            <div class="form">
              <form class="form-section">
                <div>
                  <label class="label" for="name">Name</label><br />
                  <input
                    class="input"
                    type="text"
                    id="name"
                    placeholder="Full name"
                  />
                </div>
                <div>
                  <label class="label" for="email">Email</label><br />
                  <input
                    class="input"
                    type="email"
                    id="email"
                    placeholder="Email address"
                  />
                </div>
                <div>
                  <label class="label" for="message">Message</label><br />
                  <textarea
                    class="input"
                    type="text"
                    id="message"
                    placeholder="How can we get better?"
                  ></textarea>
                </div>
                <button class="btn btn2">Send your message</button>
              </form>
            </div>
          </div>
        </div>
      </section>
      <hr />
      <!--Footer-section-->
      <section id="footer-section">
        <div class="container footer-section">
          <div>
            <h4>Lando</h4>
            <p>2021 @ Lando</p>
            <p>All rights reserved</p>
          </div>
          <div class="first-col common">
            <a href="#">Home</a><a href="#">Pricing</a><a href="#">About us</a
            ><a href="#">Contact</a>
          </div>
          <div class="second-col common">
            <a href="#">Facebook</a><a href="#">Instagram</a
            ><a href="">Twitter</a><a href="#">LinkedIn</a>
          </div>
          <div class="third-col common">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
          </div>
        </div>
      </section>
    </main>
    <script src="../script/script.js"></script>
  </body>
</html>
